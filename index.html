<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Trợ Lý AI Học Thuật Cho Giáo Viên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* KHUÔN MẪU CHUẨN IN ẤN (MASTER TEMPLATE) GIỐNG BẢN MẪU KỸ THUẬT */
        .academic-report { 
            font-family: 'Times New Roman', Times, serif; 
            font-size: 13pt; 
            line-height: 1.5; 
            color: #000; 
            text-align: justify;
            background-color: #fff;
            padding: 20px;
        }
        .academic-report h1 { 
            font-size: 16pt; 
            font-weight: bold; 
            text-align: center; 
            text-transform: uppercase; 
            margin: 15px 0; 
            color: #000; 
        }
        .academic-report h2 { 
            font-size: 14pt; 
            font-weight: bold; 
            color: #000; 
            margin-top: 20px; 
            margin-bottom: 10px; 
        }
        .academic-report h3 { 
            font-size: 13pt; 
            font-weight: bold; 
            color: #000; 
            margin-top: 15px; 
            margin-bottom: 5px; 
        }
        .academic-report p { 
            margin-bottom: 10px; 
            text-align: justify; 
        }
        .academic-report table { 
            width: 100%; 
            border-collapse: collapse; 
            margin: 15px 0; 
            font-size: 12pt; 
        }
        .academic-report th, .academic-report td { 
            border: 1px solid #000; 
            padding: 6px 10px; 
            text-align: left; 
            vertical-align: middle;
        }
        .academic-report th { 
            background-color: #f2f2f2; 
            font-weight: bold; 
        }
        .academic-report ul, .academic-report ol { 
            margin-left: 20px; 
            margin-bottom: 10px; 
        }
        .academic-report li { 
            margin-bottom: 5px; 
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300 pb-24">
    
    <div class="fixed top-4 right-4 z-50">
        <button id="themeToggleBtn" onclick="toggleTheme()" class="p-3 bg-white dark:bg-slate-800 rounded-full shadow-md border border-slate-200 dark:border-slate-700 hover:shadow-lg transition-all text-slate-600 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500" title="Chuyển chế độ Sáng/Tối">
            <svg id="moonIcon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            <svg id="sunIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </button>
    </div>

    <div class="max-w-4xl mx-auto bg-white dark:bg-slate-800 p-8 md:p-12 rounded-2xl shadow-xl mt-12 border border-slate-200 dark:border-slate-700 transition-colors duration-300">
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-extrabold text-blue-700 dark:text-blue-400 tracking-tight mb-3">Hệ Thống Trợ Lý AI Học Thuật</h1>
            <p class="text-slate-500 dark:text-slate-400 font-medium">Hỗ trợ giáo viên soạn thảo báo cáo chuẩn in ấn và thiết kế Game tương tác tùy chỉnh</p>
        </div>
        
        <div class="space-y-6">
            <div>
                <label class="block mb-2 font-semibold text-slate-700 dark:text-slate-300">1. Lựa chọn tác vụ:</label>
                <select id="toolType" onchange="switchToolMode()" class="w-full p-4 border border-slate-300 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 dark:bg-slate-700 dark:text-white transition-all font-medium">
                    <option value="latex">🧮 Soạn báo cáo kỹ thuật chuẩn in ấn (Xuất PDF trực tiếp)</option>
                    <option value="game">🎲 Thiết kế Trò chơi tương tác sư phạm (Tải về file .html)</option>
                </select>
            </div>

            <!-- Tùy chọn nâng cao cho Trò chơi (Bổ sung ô chọn số lượng câu hỏi) -->
            <div id="gameOptionsContainer" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 p-4 bg-slate-100 dark:bg-slate-700/50 rounded-xl border border-slate-200 dark:border-slate-600">
                <div>
                    <label class="block mb-1.5 font-semibold text-sm text-slate-700 dark:text-slate-300">Loại trò chơi:</label>
                    <select id="gameType" class="w-full p-3 border border-slate-300 dark:border-slate-600 rounded-lg outline-none bg-white dark:bg-slate-800 dark:text-white text-sm font-medium">
                        <option value="quiz">Trắc nghiệm kiến thức (Quiz)</option>
                        <option value="flashcard">Lật thẻ ghi nhớ (Flashcard)</option>
                        <option value="crossword">Giải mã ô chữ (Crossword)</option>
                        <option value="guessing">Đoán từ / Thuật ngữ (Word Guessing)</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1.5 font-semibold text-sm text-slate-700 dark:text-slate-300">Phong cách giao diện:</label>
                    <select id="gameStyle" class="w-full p-3 border border-slate-300 dark:border-slate-600 rounded-lg outline-none bg-white dark:bg-slate-800 dark:text-white text-sm font-medium">
                        <option value="simple">Đơn giản - Tinh tế (Clean & Minimal)</option>
                        <option value="colorful">Nhiều màu sắc - Sôi động (Vibrant & Colorful)</option>
                        <option value="chalkboard">Hoài cổ bảng đen lớp học (Classroom Chalkboard)</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1.5 font-semibold text-sm text-slate-700 dark:text-slate-300">Số lượng câu hỏi:</label>
                    <select id="numQuestions" class="w-full p-3 border border-slate-300 dark:border-slate-600 rounded-lg outline-none bg-white dark:bg-slate-800 dark:text-white text-sm font-medium">
                        <option value="5">5 câu / mục</option>
                        <option value="10" selected>10 câu / mục</option>
                        <option value="15">15 câu / mục</option>
                        <option value="20">20 câu / mục</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block mb-2 font-semibold text-slate-700 dark:text-slate-300">2. Nguồn dữ liệu đầu vào:</label>
                <div class="p-4 border-2 border-dashed border-blue-300 dark:border-blue-700/50 rounded-xl bg-blue-50/50 dark:bg-blue-900/20 mb-4 transition-all hover:border-blue-500">
                    <label class="block text-sm text-blue-800 dark:text-blue-300 font-medium mb-2">Tải tệp tin tài liệu (.docx, .pdf, .txt, Hình ảnh - Tối đa 4MB):</label>
                    <input type="file" id="fileInput" accept=".docx,.pdf,.txt,image/*" class="w-full text-slate-600 dark:text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 dark:file:bg-blue-900/50 dark:file:text-blue-200 dark:hover:file:bg-blue-800 cursor-pointer transition-colors">
                    <p id="fileStatus" class="text-xs text-slate-500 dark:text-slate-400 mt-2 font-medium"></p>
                </div>

                <label class="block mb-2 font-semibold text-slate-700 dark:text-slate-300 text-sm">Ghi chú hoặc bổ sung ý kiến (Không bắt buộc nếu đã tải tệp):</label>
                <textarea id="inputData" rows="4" class="w-full p-4 border border-slate-300 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-slate-700 dark:text-white transition-all placeholder-slate-400 dark:placeholder-slate-500 shadow-sm" placeholder="Nhập thêm yêu cầu hoặc chủ đề bài học vào đây..."></textarea>
            </div>

            <button onclick="processAI()" id="btnSubmit" class="bg-blue-600 text-white px-6 py-4 rounded-xl hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 w-full font-bold text-lg transition-all shadow-md hover:shadow-lg flex justify-center items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                Khởi chạy tiến trình AI
            </button>
        </div>

        <div class="mt-10 pt-8 border-t border-slate-200 dark:border-slate-700">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-3 gap-2">
                <label id="outputLabel" class="block font-bold text-slate-800 dark:text-slate-200 text-lg">Bản xem trước báo cáo:</label>
                
                <div id="downloadSection" class="hidden flex items-center gap-2">
                    <button id="btnDownloadPDF" onclick="downloadPDF()" class="hidden bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition-all items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        Tải về file PDF chuẩn
                    </button>
                    <button id="btnDownloadGame" onclick="downloadGameHTML()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition-all items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Tải về file Trò chơi (.html)
                    </button>
                    <button id="btnPreviewGame" onclick="previewGame()" class="hidden bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition-all items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Chơi thử ngay
                    </button>
                </div>
            </div>
            
            <div id="loading" class="hidden flex items-center gap-3 text-blue-700 dark:text-blue-300 mb-4 font-semibold p-4 bg-blue-50 dark:bg-blue-900/30 rounded-xl border border-blue-100 dark:border-blue-800">
                <svg class="animate-spin h-5 w-5 text-blue-600 dark:text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                Hệ thống AI đang phân tích dữ liệu và biên soạn, thầy cô vui lòng chờ trong giây lát...
            </div>
            
            <div id="outputContainer" class="w-full p-8 border border-slate-300 dark:border-slate-600 rounded-xl bg-white dark:bg-slate-900 shadow-inner min-h-[400px] transition-colors overflow-x-auto">
                <div id="previewContent" class="academic-report text-slate-800 dark:text-slate-100">
                    <p class="text-slate-400 italic text-center py-20 font-sans">Kết quả báo cáo tài liệu hoặc trò chơi sẽ được hiển thị tại đây...</p>
                </div>
            </div>
        </div>
    </div>

    <a href="https://zalo.me/0962128979" target="_blank" rel="noopener noreferrer" class="fixed bottom-6 right-6 bg-[#0068FF] text-white px-5 py-3.5 rounded-full shadow-lg hover:shadow-2xl hover:bg-blue-700 hover:-translate-y-1 font-bold flex items-center gap-2 z-50 transition-all duration-300 border-2 border-white dark:border-slate-700 group">
        <svg class="w-6 h-6 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21.037 8.384c-.456-4.048-4.444-6.883-8.895-6.384-3.645.426-6.685 3.42-7.147 7.07-.37 2.923 1.096 5.674 3.513 7.15l-.83 3.037c-.173.633.456 1.177 1.033.9l3.155-1.517c1.37.37 2.846.452 4.267.228 3.647-.565 6.453-3.754 6.453-7.464 0-1.026-.176-2.036-.503-3.02z" />
        </svg>
        <span class="tracking-wide shadow-sm">Liên hệ hỗ trợ</span>
    </a>

    <script>
        const htmlDoc = document.documentElement;
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlDoc.classList.add('dark');
            sunIcon.classList.add('hidden');
            moonIcon.classList.remove('hidden');
        }

        function toggleTheme() {
            if (htmlDoc.classList.contains('dark')) {
                htmlDoc.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                htmlDoc.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }

        let fileDataRaw = null;
        let fileMimeTypeRaw = null;
        let lastGeneratedGameCode = "";

        function switchToolMode() {
            const toolType = document.getElementById('toolType').value;
            const outputLabel = document.getElementById('outputLabel');
            const gameOptionsContainer = document.getElementById('gameOptionsContainer');

            if (toolType === 'latex') {
                outputLabel.textContent = "Bản xem trước báo cáo:";
                gameOptionsContainer.classList.add('hidden');
            } else {
                outputLabel.textContent = "Trạng thái trò chơi tương tác:";
                gameOptionsContainer.classList.remove('hidden');
            }
            document.getElementById('previewContent').innerHTML = '<p class="text-slate-400 italic text-center py-20 font-sans">Kết quả báo cáo tài liệu hoặc trò chơi sẽ được hiển thị tại đây...</p>';
            document.getElementById('downloadSection').classList.add('hidden');
        }

        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            const statusLabel = document.getElementById('fileStatus');
            const inputDataBox = document.getElementById('inputData');

            if (!file) {
                fileDataRaw = null;
                fileMimeTypeRaw = null;
                statusLabel.textContent = '';
                return;
            }

            if (file.size > 4 * 1024 * 1024) {
                alert("Tệp tin vượt quá dung lượng cho phép (4MB).");
                this.value = '';
                statusLabel.textContent = '';
                return;
            }

            statusLabel.textContent = `Đang xử lý tệp: ${file.name}...`;

            if (file.name.endsWith('.docx')) {
                const reader = new FileReader();
                reader.onload = async function(event) {
                    try {
                        const result = await mammoth.extractRawText({ arrayBuffer: event.target.result });
                        inputDataBox.value = result.value; 
                        fileDataRaw = null; 
                        fileMimeTypeRaw = null;
                        statusLabel.textContent = `✔ Đã trích xuất văn bản từ file Word: ${file.name}`;
                    } catch (err) {
                        statusLabel.textContent = "Lỗi khi đọc file Word!";
                    }
                };
                reader.readAsArrayBuffer(file);
            } else {
                const reader = new FileReader();
                reader.onload = function(event) {
                    fileDataRaw = event.target.result.split(',')[1];
                    fileMimeTypeRaw = file.type || 'application/pdf';
                    statusLabel.textContent = `✔ Đã tải lên tệp gốc: ${file.name}`;
                };
                reader.readAsDataURL(file);
            }
        });

        async function processAI() {
            const type = document.getElementById('toolType').value;
            const input = document.getElementById('inputData').value;
            const gameType = document.getElementById('gameType').value;
            const gameStyle = document.getElementById('gameStyle').value;
            const numQuestions = document.getElementById('numQuestions').value;
            const btn = document.getElementById('btnSubmit');
            const loading = document.getElementById('loading');
            const previewBox = document.getElementById('previewContent');
            const downloadSection = document.getElementById('downloadSection');
            const btnDownloadPDF = document.getElementById('btnDownloadPDF');
            const btnDownloadGame = document.getElementById('btnDownloadGame');
            const btnPreviewGame = document.getElementById('btnPreviewGame');

            if (!input && !fileDataRaw) {
                return alert("Vui lòng tải tệp tài liệu hoặc nhập nội dung trước khi khởi chạy!");
            }

            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            loading.classList.remove('hidden');
            previewBox.innerHTML = '';
            downloadSection.classList.add('hidden');
            btnDownloadPDF.classList.add('hidden');
            btnDownloadGame.classList.add('hidden');
            btnPreviewGame.classList.add('hidden');

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, input, fileData: fileDataRaw, fileMimeType: fileMimeTypeRaw, gameType, gameStyle, numQuestions })
                });
                
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                
                downloadSection.classList.remove('hidden');

                if (type === 'latex') {
                    previewBox.innerHTML = data.text;
                    btnDownloadPDF.classList.remove('hidden');
                    btnDownloadPDF.classList.add('flex');
                } else {
                    lastGeneratedGameCode = data.text;
                    previewBox.innerHTML = `
                        <div class="text-center py-12 font-sans">
                            <div class="inline-flex p-4 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 rounded-full mb-4">
                                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <h3 class="text-2xl font-bold text-slate-800 dark:text-white mb-2">Trò chơi tương tác đã được thiết kế thành công!</h3>
                            <p class="text-slate-500 dark:text-slate-400 max-w-md mx-auto mb-6">Thầy cô có thể tải về file .html để chạy ngoại tuyến hoặc bấm chơi thử ngay trên trình duyệt.</p>
                        </div>
                    `;
                    btnDownloadGame.classList.remove('hidden');
                    btnDownloadGame.classList.add('flex');
                    btnPreviewGame.classList.remove('hidden');
                    btnPreviewGame.classList.add('flex');
                }
            } catch (error) {
                previewBox.innerHTML = `<p class="text-rose-500 font-semibold p-4 font-sans">Đã xảy ra lỗi: ${error.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                loading.classList.add('hidden');
            }
        }

        function downloadPDF() {
            const element = document.getElementById('previewContent');
            if (!element.innerHTML.trim()) return alert("Không có nội dung báo cáo để tải về!");

            const opt = {
                margin:       10,
                filename:     'Bao-Cao-Ky-Thuat-Chuan.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(element).set(opt).save();
        }

        function downloadGameHTML() {
            if (!lastGeneratedGameCode) return alert("Chưa có mã nguồn trò chơi!");
            const blob = new Blob([lastGeneratedGameCode], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Tro-Choi-Tuong-Tac-Su-Pham.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function previewGame() {
            if (!lastGeneratedGameCode) return alert("Chưa có mã nguồn trò chơi!");
            const win = window.open();
            win.document.write(lastGeneratedGameCode);
            win.document.close();
        }
    </script>
</body>
</html>
